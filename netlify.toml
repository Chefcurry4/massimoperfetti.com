# Plain static site: the "build" only copies the public files into dist/.
# Netlify's deploy step expects dist/ (it ignored publish = "." and failed),
# and this keeps README/CLAUDE.md/netlify.toml off the live site.
# The previous Astro site lives on the `astro-site` branch.
[build]
  command = "rm -rf dist && mkdir dist && cp -r index.html me.webp fonts favicon.ico favicon.svg apple-touch-icon.png robots.txt dist/"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Old Astro routes (/projects/..., /writing/..., etc.) land on the home page.
# Not forced, so real files like /cv/... and /me.webp are still served.
[[redirects]]
  from = "/*"
  to = "/"
  status = 302
