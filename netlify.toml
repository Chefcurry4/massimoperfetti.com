# Plain static site: no build step, publish the repo root.
# The previous Astro site lives on the `astro-site` branch.
[build]
  command = "echo static site, no build"
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Old Astro routes (/projects/..., /writing/..., etc.) land on the home page.
# Not forced, so real files like /cv/... and /me.webp are still served.
[[redirects]]
  from = "/*"
  to = "/"
  status = 302
