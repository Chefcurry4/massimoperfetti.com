name: Template welcome (one-shot)

# Fires on the first push to a fresh fork; opens a self-cleaning welcome PR.
# Skipped on the upstream template repo via the `if:` guard. Removed by the
# PR itself once merged, so it never fires twice.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  welcome:
    if: github.repository != 'Chefcurry4/massimoperfetti.com'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute repo slug
        id: slug
        run: echo "name=${{ github.event.repository.name }}" >> "$GITHUB_OUTPUT"

      - name: Rewrite package.json:name
        env:
          PKG_NAME: ${{ steps.slug.outputs.name }}
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.name = process.env.PKG_NAME;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Remove the one-shot welcome workflow
        run: git rm .github/workflows/template-welcome.yml

      - name: Open welcome PR
        uses: peter-evans/create-pull-request@v6
        with:
          branch: template/welcome
          delete-branch: true
          title: "Welcome — follow SETUP.md to scaffold your site"
          commit-message: |
            chore: template welcome bootstrap

            - rename package to ${{ steps.slug.outputs.name }}
            - remove one-shot template-welcome workflow
          body: |
            👋 Welcome — this is the first step of scaffolding your site from
            the [`massimoperfetti.com` template](https://github.com/Chefcurry4/massimoperfetti.com).

            **What this PR already prepares for you:**
            - Renames `package.json:name` to `${{ steps.slug.outputs.name }}`.
            - Removes the one-shot `template-welcome.yml` workflow (it's done its job).

            **What you do next** — the first-run checklist from [`SETUP.md`](./SETUP.md):

            1. **Replace identity** — edit `src/data/{site,about,now,contacts}.ts`. Update `site.url`, `site.author`, `site.firstName`, your contacts, your "now" snippet.
            2. **Wipe the example content** — `rm src/content/{projects,work,writing,places,gallery}/*` and drop in your own. Schemas in [`src/content.config.ts`](./src/content.config.ts).
            3. **Replace personal images** — `src/assets/me.webp` + `src/assets/in.png` (bento portraits — replace the files, keep the names), `public/about/*`, `public/work/*`. Missing `/public` media falls back to gradient placeholders automatically.
            4. **Pick a theme preset** — change the one `@import` line in [`src/styles/global.css`](./src/styles/global.css). Bundled: `_default`, `_linen`, `_sapphire`, `_forest`.
            5. **Update `<head>` defaults** — `site.url`, `public/robots.txt`, `astro.config.mjs:site`.
            6. **Boot it** — `pnpm install && pnpm dev`. Open [http://localhost:4321](http://localhost:4321).

            Estimated end-to-end: ~30 minutes. Full walkthrough in [`SETUP.md`](./SETUP.md).

            Want to hide the "MIT-licensed template" chip in the bottom-right corner? Set `templateRepoUrl` to an empty string in `src/data/site.ts`.

            Anything unclear? Open a [`template-question` issue](https://github.com/${{ github.repository }}/issues/new?template=template-question.md).

            Merging this PR finalizes the bootstrap.
